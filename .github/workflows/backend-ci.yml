name: Backend CI

on:
  pull_request:
    branches: [feature/prakriti]
    paths:
      - "backend/**"
  push:
    branches: [feature/prakriti]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check imports (syntax check)
        working-directory: backend
        run: python -c "from app.app import create_app; print('App factory OK')"
        env:
          OPENAI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          MONGODB_URL: "mongodb://localhost:27017/test"
          JWT_SECRET: "ci-test-secret-not-real"
          JWT_ALGORITHM: "HS256"
          FIREBASE_CREDENTIALS: ""

      - name: Run tests
        working-directory: backend
        env:
          OPENAI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          MONGODB_URL: "mongodb://localhost:27017/test"
          JWT_SECRET: "ci-test-secret-not-real"
          JWT_ALGORITHM: "HS256"
          FIREBASE_CREDENTIALS: ""
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            python -m pytest tests/ -q --tb=short
          else
            echo "No tests yet — skipping."
          fi

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (verify it compiles)
        run: docker build -t swasth-backend-ci ./backend

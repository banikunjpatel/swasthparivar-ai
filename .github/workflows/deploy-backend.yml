name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force Docker image rebuild (no cache)"
        required: false
        default: "false"
        type: boolean

jobs:
  # ── Job 1: Run backend tests ───────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          OPENAI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          MONGODB_URL: "mongodb://localhost:27017/test"
          JWT_SECRET: "ci-test-secret-not-real"
          JWT_ALGORITHM: "HS256"
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            python -m pytest tests/ -q --tb=short
          else
            echo "No tests found — skipping."
          fi

  # ── Job 2: Deploy to EC2 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test        # only deploy if tests pass
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/swasthparivar-ai' }}"
            COMPOSE="docker compose -f $APP_DIR/docker-compose.yml"

            echo "──────────────────────────────────────"
            echo "  Deploy started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Commit: ${{ github.sha }}"
            echo "  Triggered by: ${{ github.actor }}"
            echo "──────────────────────────────────────"

            cd "$APP_DIR"

            echo ">>> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Building Docker image..."
            NOCACHE_FLAG=""
            if [[ "${{ github.event.inputs.force_rebuild || 'false' }}" == "true" ]]; then
              NOCACHE_FLAG="--no-cache"
            fi
            $COMPOSE build $NOCACHE_FLAG backend

            echo ">>> Restarting container..."
            $COMPOSE up -d --no-deps backend

            echo ">>> Waiting for health check (up to 60s)..."
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' swasth-backend 2>/dev/null || echo "starting")
              echo "  [$i/12] Health: $STATUS"
              if [[ "$STATUS" == "healthy" ]]; then
                echo ">>> Container healthy ✅"
                break
              fi
              if [[ $i -eq 12 ]]; then
                echo ">>> ERROR: Container not healthy after 60s ❌"
                $COMPOSE logs --tail=100 backend
                exit 1
              fi
            done

            echo ">>> Pruning dangling images..."
            docker image prune -f

            echo ">>> Deployment complete ✅"
            $COMPOSE ps

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to EC2 FAILED. Check the SSH step logs above."

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasth-backend
    restart: always
    env_file:
      - .env
    environment:
      - WEB_CONCURRENCY=2
    ports:
      - "127.0.0.1:8000:8000"   # Bind to localhost only; Nginx proxies externally
    volumes:
      # Mount Firebase service account key (do NOT bake secrets into the image)
      - ./backend/credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: swasth-net
